<div class="pubs-page">
  <aside class="pubs-sidebar">
    <div class="filter-section">
      <h3>Publication Type</h3>
      <div id="typeFilters"></div>
    </div>
    <div class="filter-section">
      <h3>Year</h3>
      <div class="year-input">
        <input type="number" id="yearFrom" placeholder="From" min="2018" max="2030">
        <span>–</span>
        <input type="number" id="yearTo" placeholder="To" min="2018" max="2030">
      </div>
    </div>
    <div class="filter-section">
      <h3>First Author</h3>
      <label><input type="checkbox" id="firstAuthorOnly"> First-author papers</label>
    </div>
    <button class="show-all-btn" onclick="showAllPublications()">Show all</button>
    <button class="reset-btn" onclick="resetFilters()">Reset All Filters</button>
  </aside>

  <div class="pubs-main">
    <div class="page-header">
      <h1>Publications</h1>
    </div>
    <div class="result-count" id="resultCount"></div>
    <div id="pubList"></div>
  </div>
</div>

<div class="modal-overlay" id="bibtexModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h3 id="modalTitle">BibTeX</h3>
    <pre id="modalContent"></pre>
    <button class="modal-copy" onclick="copyBibtex()">📋 Copy to Clipboard</button>
  </div>
</div>

<script>
let allEntries = [];
let rawBibtex = '';

async function loadData() {
  const pubListDiv = document.getElementById('pubList');
  pubListDiv.innerHTML = '<div class="no-results">⏳ Loading publications...</div>';
  document.getElementById('resultCount').textContent = '';

  try {
    const researchUrl = '{{ "/files/Research.txt" | relative_url }}?t=' + Date.now();
    const resp = await fetch(researchUrl);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    rawBibtex = await resp.text();
  } catch (err) {
    pubListDiv.innerHTML = `<div class="no-results" style="display:flex; align-items:center; justify-content:flex-start; gap:12px; text-align:left; padding:20px 0; font-size:1.05rem; color:#4a4a4a;">❌ Cannot load 'Research.txt' ${err.message}</div>`;
    return;
  }

  processAndRender();
}

function processAndRender() {
  const typeFiltersDiv = document.getElementById('typeFilters');

  allEntries = parseBibtex(rawBibtex).map(e => {
    const cat = classifyType(e);
    return {
      ...e,
      category: cat,
      title: e.fields.title || 'Untitled',
      authors: formatAuthors(e.fields.author),
      year: parseInt(e.fields.year) || null,
      venue: buildVenue(e.fields, e.type),
      isFirst: isFirstAuthor(e.fields),
      doi: e.fields.doi || null,
      url: e.fields.url || (e.fields.doi ? `https://doi.org/${e.fields.doi}` : null),
      bibtex: buildBibtexString(e)
    };
  }).sort((a, b) => (b.year || 0) - (a.year || 0));

  typeFiltersDiv.innerHTML = '';
  const typeCounts = {};
  allEntries.forEach(e => {
    typeCounts[e.category] = (typeCounts[e.category] || 0) + 1;
  });
  Object.keys(typeMap).forEach(cat => {
    if (!typeCounts[cat]) return;
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" data-type="${cat}" checked> ${typeMap[cat]} <span class="count-badge">${typeCounts[cat]}</span>`;
    typeFiltersDiv.appendChild(label);
  });

  typeFiltersDiv.addEventListener('change', render);
  document.getElementById('yearFrom').addEventListener('input', render);
  document.getElementById('yearTo').addEventListener('input', render);
  document.getElementById('firstAuthorOnly').addEventListener('change', render);
  document.getElementById('bibtexModal').addEventListener('click', e => {
    if (e.target === document.getElementById('bibtexModal')) closeModal();
  });

  render();
}

document.addEventListener('DOMContentLoaded', () => {
  const firstOnlyBox = document.getElementById('firstAuthorOnly');
  if (firstOnlyBox) firstOnlyBox.checked = true;
  loadData();
});

function parseBibtex(raw) {
  const entries = [];
  const regex = /@(\w+)\{([^,]*),\s*([\s\S]*?)\n\}/g;
  let m;
  while ((m = regex.exec(raw)) !== null) {
    const type = m[1];
    const key = m[2].trim();
    const body = m[3];
    const fields = {};
    const fieldRegex = /(\w+)\s*=\s*\{((?:[^{}]|\{[^{}]*\})*)\}/g;
    let fm;
    while ((fm = fieldRegex.exec(body)) !== null) {
      fields[fm[1].toLowerCase()] = fm[2].trim();
    }
    const fieldRegex2 = /(\w+)\s*=\s*([^\s,{][^\s,]*)/g;
    while ((fm = fieldRegex2.exec(body)) !== null) {
      if (!fields[fm[1].toLowerCase()]) {
        fields[fm[1].toLowerCase()] = fm[2].trim();
      }
    }
    entries.push({ type, key, fields });
  }
  return entries;
}

function formatAuthors(authorStr) {
  if (!authorStr) return '';
  return authorStr.split(' and ').map(a => {
    const parts = a.split(',').map(s => s.trim());
    return parts.length >= 2 ? `${parts[1]} ${parts[0]}` : a.trim();
  }).join(', ');
}

function isFirstAuthor(fields) {
  if (!fields.author) return false;
  const first = fields.author.split(' and ')[0].trim().toLowerCase();
  return first.includes('chai');
}

function isDataset(entry) {
  const t = (entry.fields.title || '').toLowerCase();
  return t.includes('dataset') || (entry.fields.journal || '').toLowerCase() === 'zenodo';
}

function classifyType(entry) {
  const t = entry.type.toLowerCase();
  if (isDataset(entry)) return 'Dataset';
  if (t === 'unpublished') return 'Unpublished';
  if (t === 'inproceedings') return 'Conference';
  if (t === 'phdthesis' || t === 'mastersthesis') return 'Thesis';
  if (t === 'article') return 'Journal';
  return 'Other';
}

function buildVenue(fields, type) {
  const journal = fields.journal || '';
  const booktitle = fields.booktitle || '';
  const venue = journal || booktitle;
  const parts = [venue];
  if (fields.volume) parts[0] += ` ${fields.volume}`;
  if (fields.number) parts[0] += `(${fields.number})`;
  if (fields.pages) parts[0] += `: ${fields.pages}`;
  return parts[0];
}

function buildBibtexString(entry) {
  const f = entry.fields;
  let s = `@${entry.type}{${entry.key},\n`;
  if (f.author) s += `  author = {${f.author}},\n`;
  if (f.title) s += `  title = {${f.title}},\n`;
  if (f.journal) s += `  journal = {${f.journal}},\n`;
  if (f.booktitle) s += `  booktitle = {${f.booktitle}},\n`;
  if (f.volume) s += `  volume = {${f.volume}},\n`;
  if (f.number) s += `  number = {${f.number}},\n`;
  if (f.pages) s += `  pages = {${f.pages}},\n`;
  if (f.year) s += `  year = {${f.year}},\n`;
  if (f.doi) s += `  doi = {${f.doi}},\n`;
  if (f.url) s += `  url = {${f.url}},\n`;
  s += `}`;
  return s;
}

const typeMap = {
  'Journal': 'Journal Article',
  'Conference': 'Conference',
  'Thesis': 'Thesis',
  'Dataset': 'Dataset',
  'Unpublished': 'Unpublished'
};

const typeFiltersDiv = document.getElementById('typeFilters');
const pubListDiv = document.getElementById('pubList');
const resultCountDiv = document.getElementById('resultCount');

function getActiveFilters() {
  const checked = [...typeFiltersDiv.querySelectorAll('input:checked')].map(i => i.dataset.type);
  const yearFrom = parseInt(document.getElementById('yearFrom').value) || null;
  const yearTo = parseInt(document.getElementById('yearTo').value) || null;
  const firstOnly = document.getElementById('firstAuthorOnly').checked;
  return { checked, yearFrom, yearTo, firstOnly };
}

function render() {
  const { checked, yearFrom, yearTo, firstOnly } = getActiveFilters();

  const filtered = allEntries.filter(e => {
    if (!checked.includes(e.category)) return false;
    if (yearFrom && e.year && e.year < yearFrom) return false;
    if (yearTo && e.year && e.year > yearTo) return false;
    if (firstOnly && !e.isFirst) return false;
    return true;
  });

  resultCountDiv.textContent = `Showing ${filtered.length} of ${allEntries.length} publications`;

  if (filtered.length === 0) {
    pubListDiv.innerHTML = '<div class="no-results">No publications match the current filters.</div>';
    return;
  }

  pubListDiv.innerHTML = filtered.map((e, i) => {
    let authorsHtml = '';
    if (e.isFirst) {
      const parts = e.authors.split(', ');
      parts[0] = `<span class="first-author">${parts[0]}</span>`;
      authorsHtml = parts.join(', ');
    } else {
      authorsHtml = e.authors;
    }

    let tagsHtml = `<span class="pub-tag">${e.category}</span>`;
    if (e.category === 'Dataset') tagsHtml += '<span class="pub-tag tag-dataset">Dataset</span>';
    if (e.category === 'Unpublished') tagsHtml += '<span class="pub-tag tag-unpublished">Unpublished</span>';
    if (e.isFirst) tagsHtml += '<span class="pub-tag">First Author</span>';

    const venueParts = [];
    if (e.venue) venueParts.push(e.venue);
    if (e.year) venueParts.push(e.year);
    const metaLine = venueParts.join(' · ');

    let actionsHtml = '';
    if (e.url) {
      actionsHtml += `<a href="${e.url}" target="_blank" class="pub-btn"><span class="icon">🔗</span> Paper</a>`;
    }
    actionsHtml += `<button class="pub-btn" onclick="showBibtex(${i})"><span class="icon">📖</span> BibTeX</button>`;

    return `
      <div class="pub-card">
        <div class="pub-title">
          ${e.url ? `<a href="${e.url}" target="_blank">${e.title}</a>` : e.title}
        </div>
        <div class="pub-authors">${authorsHtml}</div>
        ${metaLine ? `<div class="pub-meta">${metaLine}</div>` : ''}
        <div class="pub-tags">${tagsHtml}</div>
        <div class="pub-actions">${actionsHtml}</div>
      </div>
    `;
  }).join('');
}

function showBibtex(idx) {
  const filtered = allEntries.filter(e => {
    const { checked, yearFrom, yearTo, firstOnly } = getActiveFilters();
    if (!checked.includes(e.category)) return false;
    if (yearFrom && e.year && e.year < yearFrom) return false;
    if (yearTo && e.year && e.year > yearTo) return false;
    if (firstOnly && !e.isFirst) return false;
    return true;
  });
  const e = filtered[idx];
  document.getElementById('modalTitle').textContent = `BibTeX — ${e.title}`;
  document.getElementById('modalContent').textContent = e.bibtex;
  document.getElementById('bibtexModal').classList.add('show');
}

function closeModal() {
  document.getElementById('bibtexModal').classList.remove('show');
}

function copyBibtex() {
  const text = document.getElementById('modalContent').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.modal-copy');
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = '📋 Copy to Clipboard', 1500);
  });
}

function resetFilters() {
  typeFiltersDiv.querySelectorAll('input').forEach(i => i.checked = true);
  document.getElementById('yearFrom').value = '';
  document.getElementById('yearTo').value = '';
  document.getElementById('firstAuthorOnly').checked = true;
  render();
}

function showAllPublications() {
  typeFiltersDiv.querySelectorAll('input').forEach(i => i.checked = true);
  document.getElementById('yearFrom').value = '';
  document.getElementById('yearTo').value = '';
  document.getElementById('firstAuthorOnly').checked = false;
  render();
}
</script>
